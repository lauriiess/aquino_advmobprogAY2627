name: aquino_advmobprog
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_dotenv: ^6.0.1
  flutter_screenutil: ^5.9.3
  http: ^1.6.0
